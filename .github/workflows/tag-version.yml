# Creates the git tags for the app versions.
# The only place to set a version is VERSION in index.html (main app) and in stats/index.html
# (stats edition). After a push to main, this workflow tags that commit as v<VERSION> and
# stats-v<VERSION> unless the tag already exists.
name: Tag version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag current version
        run: |
          version=$(grep -oP "var VERSION = '\K[^']+" index.html || true)
          if [ -z "$version" ]; then echo "::error::VERSION not found in index.html"; exit 1; fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi
          git tag -a "$tag" -m "$tag - $(git log -1 --format=%s)"
          git push origin "$tag"
          echo "Created $tag"

      - name: Tag stats edition version
        run: |
          version=$(grep -oP "var VERSION = '\K[^']+" stats/index.html || true)
          if [ -z "$version" ]; then echo "::error::VERSION not found in stats/index.html"; exit 1; fi
          tag="stats-v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi
          git tag -a "$tag" -m "$tag - $(git log -1 --format=%s)"
          git push origin "$tag"
          echo "Created $tag"
