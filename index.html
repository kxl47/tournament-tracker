/* Layout: one centered column. Crest, title and progress on top, then one of two tabs.
   Everything is sized in --u (1px x --k). The script picks --k so the Teams tab, the tallest form, fits the screen without scrolling; the other tab uses the same scale. */
:root {
  --ink: #101010;
  --black: #000000;
  --pink: #e058b0;
  --pink-dim: #5a2a49;
  --paper: #f8f8f8;
  --mute: #9a8d96;
  --line: #2b2429;
  --panel: #1a1618;
  --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --k: 1;
  --u: calc(var(--k) * 1px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

html, body { background: var(--ink); }
body {
  background: var(--ink); color: var(--paper); font-family: var(--body); font-size: calc(var(--u) * 16); line-height: 1.3;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(var(--u) * 8) 70px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin: 0 auto; position: relative; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

header.top { display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(var(--u) * 2) 0 calc(var(--u) * 12); }
header.top img { width: calc(var(--u) * 86); height: calc(var(--u) * 104); flex: none; display: block; }
.head-text { min-width: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
.head-text h1 { font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 24); line-height: 1.1; margin: calc(var(--u) * 8) 0 0; letter-spacing: .01em; overflow-wrap: anywhere; }
.progress { margin-top: calc(var(--u) * 9); width: 60%; max-width: 260px; height: calc(var(--u) * 6); background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .25s; }
.progress-label { margin-top: calc(var(--u) * 5); font-family: var(--num); font-weight: 600; font-size: calc(var(--u) * 14); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }

h2.sec { font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 17); margin: 0 0 calc(var(--u) * 8); display: flex; justify-content: center; align-items: baseline; gap: calc(var(--u) * 12); text-align: center; }
h2.sec small { font-family: var(--num); font-weight: 600; font-size: calc(var(--u) * 14); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }

/* standings */
.tbl-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.std { width: 100%; border-collapse: collapse; font-family: var(--num); font-variant-numeric: tabular-nums; }
.std th { font-weight: 600; font-size: calc(var(--u) * 14); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); text-align: right; padding: calc(var(--u) * 5) calc(var(--u) * 6); border-bottom: 2px solid var(--pink); }
.std td { font-size: calc(var(--u) * 21); font-weight: 600; text-align: right; padding: calc(var(--u) * 10) calc(var(--u) * 6); border-bottom: 1px solid var(--line); }
.std th.l, .std td.l { text-align: left; }
.std td.pos { width: calc(var(--u) * 28); color: var(--mute); font-size: calc(var(--u) * 18); padding-left: 0; }
.std td.team { font-family: var(--body); font-weight: 600; font-size: calc(var(--u) * 17); max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.std td.pts { color: var(--black); }
.std td.pts b { display: inline-block; min-width: calc(var(--u) * 38); text-align: center; background: var(--pink); color: var(--black); border-radius: calc(var(--u) * 6); padding: 1px calc(var(--u) * 6); font-weight: 700; }
.std tr.lead td.team, .std tr.lead td.pos { color: var(--pink); }
.std td.dim { color: var(--paper); font-weight: 500; }
.std tr.tap { cursor: pointer; }
.std tr.pl td { font-family: var(--body); font-size: calc(var(--u) * 14); font-weight: 500; color: var(--mute); text-align: left; padding: calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 10); white-space: normal; }
.note { color: var(--mute); font-size: calc(var(--u) * 13); margin: calc(var(--u) * 10) 0 0; text-align: center; }
.notes { list-style: none; margin: calc(var(--u) * 12) auto 0; padding: 0; width: fit-content; max-width: 100%; color: var(--mute); font-size: calc(var(--u) * 14); }
.notes li { display: flex; align-items: center; gap: calc(var(--u) * 10); padding: calc(var(--u) * 2) 0; }
.notes li::before { content: ""; flex: none; width: calc(var(--u) * 12); height: calc(var(--u) * 12); background: var(--pink); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

/* finals */
#finals { margin-top: calc(var(--u) * 20); }
.final .t.ph { color: var(--mute); font-weight: 500; }
input.sc:disabled { border-style: dashed; background: transparent; }

/* matches */
.rd { display: flex; justify-content: center; align-items: baseline; gap: calc(var(--u) * 10); font-family: var(--num); font-weight: 700; font-size: calc(var(--u) * 15); letter-spacing: .1em; text-transform: uppercase; color: var(--pink); margin: calc(var(--u) * 14) 0 calc(var(--u) * 2); }
.rd small { color: var(--mute); font-weight: 600; font-size: inherit; }

<script>
(function () {
  // The only place to set the version: the footer, the offline cache (sw.js) and the git tag all follow it.
  var VERSION = '1.4', BUILD_DATE = '2026-10-30';
  var KEY = 'sexyfc-tournament';
  var S = null, tab = 'table', confirmTimer = null, exp = {}, addingP = '', notice = null;
  var AUTO_KEY = KEY + '-auto';

  function load() { try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function uid() { return 't' + Math.random().toString(36).slice(2, 8); }
  function pid() { return 'p' + Math.random().toString(36).slice(2, 8); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function isPlayed(m) { return m.hg !== null && m.ag !== null; }

  function schedule(teams, dbl) {
    var ids = teams.map(function (t) { return t.id; });
    if (ids.length % 2) ids.push(null);
    var n = ids.length, arr = ids.slice(), rounds = [];
    for (var r = 0; r < n - 1; r++) {
      var ms = [];
      for (var i = 0; i < n / 2; i++) {
        var a = arr[i], b = arr[n - 1 - i];
        if (a !== null && b !== null) ms.push(r % 2 ? [b, a] : [a, b]);
      }
      rounds.push(ms);
      arr = [arr[0], arr[n - 1]].concat(arr.slice(1, n - 1));
    }
    if (dbl) rounds = rounds.concat(rounds.map(function (ms) { return ms.map(function (m) { return [m[1], m[0]]; }); }));
    var out = [], k = 0;
    rounds.forEach(function (ms, ri) { ms.forEach(function (m) { out.push({ id: 'm' + (k++), round: ri + 1, h: m[0], a: m[1], hg: null, ag: null }); }); });
    return out;
  }

  function fresh() {
    var teams = ['Team Pink', 'Team Black', 'Team White', 'Team Blue'].map(function (n) { return { id: uid(), name: n, players: [] }; });
    return { title: 'Tournament', teams: teams, dbl: false, dirty: false, matches: schedule(teams, false), finals: {} };
  }

  function findTeam(id) { for (var i = 0; i < S.teams.length; i++) if (S.teams[i].id === id) return S.teams[i]; return null; }
  function teamName(id) { var t = findTeam(id); return t ? t.name : null; }
  function validMatches() { return S.matches.filter(function (m) { return teamName(m.h) !== null && teamName(m.a) !== null; }); }
  function hasResults() { return S.matches.some(isPlayed) || ['cup', 'plate'].some(function (k) { return !!finalResult(k); }); }

  /* Finals: Cup = 1st vs 2nd, Plate = second-to-last vs last. The pairing follows the table and is
     only fixed once every group match is played. A final score is stored with the two team ids,
     so it disappears if the table later changes who plays that final. */
  function finalsReady() { var vm = validMatches(); return !S.dirty && vm.length > 0 && vm.every(isPlayed) && S.teams.length >= 4; }
  function finalPair(kind) {
    if (!finalsReady()) return null;
    var rows = standings(), n = rows.length;
    return kind === 'cup' ? { h: rows[0], a: rows[1], rh: 1, ra: 2 } : { h: rows[n - 2], a: rows[n - 1], rh: n - 1, ra: n };
  }
  function finalEntry(kind) {
    var pr = finalPair(kind), f = (S.finals || {})[kind];
    return pr && f && f.h === pr.h.id && f.a === pr.a.id ? f : null;
  }
  function finalResult(kind) { var f = finalEntry(kind); return f && isPlayed(f) ? f : null; }


  function standings() {
    var rows = {};
    S.teams.forEach(function (t) { rows[t.id] = { id: t.id, name: t.name, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
    validMatches().forEach(function (m) {
      if (!isPlayed(m)) return;
      var h = rows[m.h], a = rows[m.a];
      h.p++; a.p++; h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;
      if (m.hg > m.ag) { h.w++; a.l++; h.pts += 3; }
      else if (m.hg < m.ag) { a.w++; h.l++; a.pts += 3; }
      else { h.d++; a.d++; h.pts++; a.pts++; }
    });
    return Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (x, y) {
      return (y.pts - x.pts) || ((y.gf - y.ga) - (x.gf - x.ga)) || (y.gf - x.gf) || x.name.localeCompare(y.name, 'en');
    });
  }

  function updateHeader() {
    var vm = validMatches(), played = vm.filter(isPlayed).length;
    document.getElementById('title').textContent = S.title || 'Tournament';
    document.getElementById('bar').style.width = (vm.length ? played / vm.length * 100 : 0) + '%';
    document.getElementById('plabel').textContent = played + ' of ' + vm.length + ' matches played';
  }

  function renderTable() {
    var rows = standings();
    var h = '<h2 class="sec">Standings</h2><div class="tbl-scroll"><table class="std"><thead><tr><th class="l">#</th><th class="l">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Goals</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var td = r.gf - r.ga, t = findTeam(r.id), pl = ((t && t.players) || []).map(function (p) { return p.name.trim(); }).filter(Boolean);
      h += '<tr class="tap' + (i === 0 && r.p > 0 ? ' lead' : '') + '" data-act="expand" data-id="' + r.id + '"><td class="pos l">' + (i + 1) + '</td><td class="team l">' + esc(r.name) + '</td>' +
        '<td class="dim">' + r.p + '</td><td class="dim">' + r.w + '</td><td class="dim">' + r.d + '</td><td class="dim">' + r.l + '</td>' +
        '<td class="dim">' + r.gf + ':' + r.ga + '</td><td class="dim">' + (td > 0 ? '+' : '') + td + '</td><td class="pts"><b>' + r.pts + '</b></td></tr>';
      if (exp[r.id]) h += '<tr class="pl"><td></td><td colspan="8">' + (pl.length ? esc(pl.join(' · ')) : 'No players added yet') + '</td></tr>';
    });
    h += '</tbody></table></div><ul class="notes"><li>Tap a team to see its players.</li><li>Sorted by points, goal difference, goals scored.</li><li>Win 3, draw 1, loss 0.</li></ul>';
    return h;
  }

  function level(a, b) { return a.pts === b.pts && (a.gf - a.ga) === (b.gf - b.ga) && a.gf === b.gf; }

  function renderFinals() {
    var vm = validMatches(), played = vm.filter(isPlayed).length, n = S.teams.length;
    if (n < 4) return '<h2 class="sec">Finals</h2><p class="note">Finals need at least 4 teams.</p>';
    var ready = finalsReady();
    var h = '<h2 class="sec">Finals<small>' + (ready ? 'Live from the table' : played + '/' + vm.length + ' results in') + '</small></h2>';
    function row(kind, title) {
      var pr = finalPair(kind), f = finalEntry(kind) || { hg: null, ag: null };
      var rh = kind === 'cup' ? 1 : n - 1, ra = kind === 'cup' ? 2 : n;
      var c = '<div class="rd">' + title + '<small>' + ord(rh) + ' vs ' + ord(ra) + '</small></div><div class="match final">';
      function inp(side, team, v) {
        return '<input class="sc' + (v !== null ? ' has' : '') + '" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="' + title + ' goals ' + esc(team) + '" id="f' + side + '-' + kind + '" data-final="' + kind + '" data-side="' + side + '" value="' + (v !== null ? v : '') + '"' + (pr ? '' : ' disabled') + '>';
      }
      if (pr) c += '<span class="t h">' + esc(pr.h.name) + '</span>' + inp('h', pr.h.name, f.hg) + '<span class="c">:</span>' + inp('a', pr.a.name, f.ag) + '<span class="t">' + esc(pr.a.name) + '</span>';
      else c += '<span class="t h ph">' + ord(rh) + ' place</span>' + inp('h', ord(rh) + ' place', null) + '<span class="c">:</span>' + inp('a', ord(ra) + ' place', null) + '<span class="t ph">' + ord(ra) + ' place</span>';
      return c + '</div>';
    }
    h += row('cup', 'Cup Final') + row('plate', 'Plate Final');
    if (ready) {
      var rows = standings(), cuts = [1]; if (n - 3 !== 1) cuts.push(n - 3);
      cuts.forEach(function (i) {
        if (level(rows[i], rows[i + 1])) h += '<p class="note">' + esc(rows[i].name) + ' and ' + esc(rows[i + 1].name) + ' are level on points, goal difference and goals. Their order falls back to alphabetical.</p>';
      });
    }
    return h;
  }

  function renderGames() {
    var vm = validMatches(), h = '<h2 class="sec">Matches</h2>';
    if (S.dirty) h += '<div class="banner">The team list changed. Rebuild the fixtures under “Teams”.</div>';
    var byRound = {};
    vm.forEach(function (m) { (byRound[m.round] = byRound[m.round] || []).push(m); });
    Object.keys(byRound).forEach(function (r) {
      var ms = byRound[r], done = ms.filter(isPlayed).length;
      h += '<section class="round"><div class="rd">Matchday ' + r + '<small data-rc="' + r + '">' + done + '/' + ms.length + '</small></div>';
      ms.forEach(function (m) {
        h += '<div class="match"><span class="t h">' + esc(teamName(m.h)) + '</span>' +
          '<input class="sc' + (m.hg !== null ? ' has' : '') + '" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Goals ' + esc(teamName(m.h)) + '" id="h-' + m.id + '" data-score="h" data-m="' + m.id + '" value="' + (m.hg !== null ? m.hg : '') + '">' +
          '<span class="c">:</span>' +
          '<input class="sc' + (m.ag !== null ? ' has' : '') + '" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Goals ' + esc(teamName(m.a)) + '" id="a-' + m.id + '" data-score="a" data-m="' + m.id + '" value="' + (m.ag !== null ? m.ag : '') + '">' +
          '<span class="t">' + esc(teamName(m.a)) + '</span></div>';
      });
      h += '</section>';
    });
    if (!vm.length) h += '<p class="note">No matches yet. Add at least two teams and rebuild the fixtures.</p>';
    return h;
  }

  var bk = { mode: '', msg: '', ok: false, text: '' };
  function renderBackup() {
    var h = '<div class="backup"><h2 class="sec">Backup</h2><div class="actions"><button class="btn" data-act="bk-copy">Copy backup</button><button class="btn" data-act="bk-restore">Restore</button></div>';
    var ta = ' id="bk-text" wrap="off" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"';
    if (bk.mode === 'show') h += '<textarea' + ta + ' readonly aria-label="Backup text">' + esc(bk.text) + '</textarea>';
    if (bk.mode === 'paste') h += '<textarea' + ta + ' placeholder="Paste your backup text here" aria-label="Paste backup"></textarea><button class="btn fill block" style="margin-top:8px" data-act="bk-load" data-confirm="' + (hasResults() ? '1' : '') + '">Load backup</button>' + (autoBackup() ? '<button class="btn block sm" style="margin-top:8px" data-act="bk-auto">Insert last automatic backup</button>' : '');
    if (bk.msg) h += '<p class="msg' + (bk.ok ? ' ok' : '') + '">' + esc(bk.msg) + '</p>';
    return h + '</div>';
  }

  function clean(s) { return String(s).replace(/[\r\n|]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function label(t, i) { return clean(t.name) || ('Team ' + (i + 1)); }
  function backupText() {
    var names = {}, L = ['SEXY F.C. TOURNAMENT BACKUP', 'NOTE: This is an automatic backup. Do not edit this text, changes may break the import.', 'Title: ' + clean(S.title), 'Mode: ' + (S.dbl ? 'home & away' : 'single round'), '', 'TEAMS (name | players)'];
    S.teams.forEach(function (t, i) {
      names[t.id] = label(t, i);
      L.push(names[t.id] + ' | ' + (t.players || []).map(function (p) { return clean(String(p.name).replace(/,/g, ' ')); }).filter(Boolean).join(', '));
    });
    L.push('', 'RESULTS (matchday | score | match)');
    validMatches().forEach(function (m) {
      L.push('MD' + m.round + ' | ' + (isPlayed(m) ? m.hg + ':' + m.ag : '-:-') + ' | ' + names[m.h] + ' vs ' + names[m.a]);
    });
    [['cup', 'CUP'], ['plate', 'PLATE']].forEach(function (k) {
      var f = finalResult(k[0]);
      if (f) L.push(k[1] + ' | ' + f.hg + ':' + f.ag + ' | ' + names[f.h] + ' vs ' + names[f.a]);
    });
    return L.join('\n');
  }

  function parseBackup(raw) {
    var txt = String(raw || '').replace(/\r/g, '').replace(/[\u200b\u00a0\ufeff]/g, ' ');
    var title = 'Tournament', dbl = false, sec = '', teams = [], res = [], skipped = 0;
    txt.split('\n').forEach(function (line) {
      var l = line.trim(), m;
      if (!l) return;
      if ((m = /^title\s*:\s*(.*)$/i.exec(l))) { title = m[1].trim() || 'Tournament'; return; }
      if ((m = /^mode\s*:\s*(.*)$/i.exec(l))) { dbl = /home|away|double/i.test(m[1]); return; }
      if (/^teams\s*\(name/i.test(l) || /^teams\s*:?\s*$/i.test(l)) { sec = 't'; return; }
      if (/^results\s*\(match/i.test(l) || /^results\s*:?\s*$/i.test(l)) { sec = 'r'; return; }
      if (/^sexy f\.c\. tournament backup/i.test(l)) return;
      if (sec === 't') {
        var i = l.indexOf('|'), name = (i < 0 ? l : l.slice(0, i)).trim();
        var pl = (i < 0 ? '' : l.slice(i + 1)).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
        if (name) teams.push({ name: name, players: pl });
      } else if (sec === 'r') {
        var r = /^(MD\s*\d+|CUP|PLATE)\s*\|\s*(\d{1,3}|-)\s*:\s*(\d{1,3}|-)\s*\|\s*(.+)$/i.exec(l);
        if (r) res.push({ fin: /^md/i.test(r[1]) ? '' : r[1].toLowerCase(), hg: r[2] === '-' ? null : parseInt(r[2], 10), ag: r[3] === '-' ? null : parseInt(r[3], 10), rest: r[4] }); else skipped++;
      }
    });
    if (teams.length < 2) return { error: 'No teams found. Paste the complete backup text, starting with "SEXY F.C. TOURNAMENT BACKUP".' };
    if (teams.length > 16) return { error: 'More than 16 teams found. Check the text.' };
    var built = teams.map(function (t) { return { id: uid(), name: t.name, players: t.players.map(function (n) { return { id: pid(), name: n }; }) }; });
    var ms = schedule(built, dbl), finals = {}, applied = 0;
    function idxs(name) { var o = []; built.forEach(function (t, i) { if (t.name.toLowerCase() === name.toLowerCase()) o.push(i); }); return o; }
    function find(h, a) { for (var k = 0; k < ms.length; k++) if (!ms[k].set && ms[k].h === built[h].id && ms[k].a === built[a].id) return ms[k]; return null; }
    res.forEach(function (r) {
      if ((r.hg === null) !== (r.ag === null)) { skipped++; return; }
      var parts = r.rest.split(/\s+vs\s+/i), done = false;
      for (var cut = 1; cut < parts.length && !done; cut++) {
        var hs = idxs(parts.slice(0, cut).join(' vs ')), as = idxs(parts.slice(cut).join(' vs '));
        if (r.fin) {
          if (hs.length && as.length && r.hg !== null) { finals[r.fin] = { h: built[hs[0]].id, a: built[as[0]].id, hg: r.hg, ag: r.ag }; done = true; applied++; }
          continue;
        }
        for (var x = 0; x < hs.length && !done; x++) for (var y = 0; y < as.length && !done; y++) {
          var m = find(hs[x], as[y]), sw = false;
          if (!m) { m = find(as[y], hs[x]); sw = !!m; }
          if (m) { m.set = true; m.hg = sw ? r.ag : r.hg; m.ag = sw ? r.hg : r.ag; done = true; if (r.hg !== null) applied++; }
        }
      }
      if (!done) skipped++;
    });
    ms.forEach(function (m) { delete m.set; });
    return { state: { title: title, teams: built, dbl: dbl, dirty: false, matches: ms, finals: finals }, teams: built.length, applied: applied, skipped: skipped };
  }

  /* Before an action that throws away results, the current state goes to the clipboard as backup
     text and is also kept on the device, so it can be restored under Backup > Restore. */
  function autoBackup() { try { return localStorage.getItem(AUTO_KEY) || ''; } catch (e) { return ''; } }
  function safetyCopy() {
    if (!hasResults()) return;
    var txt = backupText();
    try { localStorage.setItem(AUTO_KEY, txt); } catch (e) {}
    notice = { msg: 'Previous state saved. Restore it under Backup > Restore if needed.', warn: true };
    function ok() {
      notice = { msg: 'Previous state copied to the clipboard as backup text.', warn: false };
      var el = document.querySelector('.notice'); if (el) { el.textContent = notice.msg; el.classList.remove('warn'); }
    }
    try { navigator.clipboard.writeText(txt).then(ok, function () {}); } catch (e) {}
  }
  /* Shown under a button waiting for its second tap. Every guarded action ends with new fixtures or a new tournament, so all results go. */
  var ARM_HINT = '<b>If you continue, all existing results will likely be lost.</b> The current state is copied to the clipboard as backup text and kept on this device (Backup &rsaquo; Restore).';
  function disarm(b) {
    b.textContent = b.dataset.label; delete b.dataset.armed; b.classList.remove('armed');
    var h = document.getElementById('arm-hint'); if (h) h.remove();
  }

  function renderNotice() { return notice ? '<p class="notice' + (notice.warn ? ' warn' : '') + '">' + esc(notice.msg) + '</p>' : ''; }

  function renderMain() {
    return renderNotice() + '<div id="standings">' + renderTable() + '</div><div id="finals">' + renderFinals() + '</div><div id="matches">' + renderGames() + '</div>' + renderBackup();
  }

  function renderTeams(closed) {
    var cf = hasResults() ? '1' : '';
    var h = (closed ? '' : renderNotice()) + '<div class="group"><label class="label" for="in-title">Tournament name</label><div class="field" style="margin:0"><input class="txt" id="in-title" data-title value="' + esc(S.title) + '"></div></div>';
    h += '<div class="group"><span class="label">Teams (' + S.teams.length + ')</span>';
    S.teams.forEach(function (t, i) {
      var pl = t.players || [];
      h += '<div class="team-block"><div class="field"><input class="txt" id="team-' + t.id + '" data-name="' + t.id + '" value="' + esc(t.name) + '" aria-label="Team ' + (i + 1) + ' name">' +
        '<button class="btn sq" data-act="remove" data-id="' + t.id + '" data-confirm="' + cf + '" aria-label="Remove team"' + (S.teams.length <= 2 ? ' disabled' : '') + '>&times;</button></div><div class="chips">';
      pl.forEach(function (p) {
        h += '<span class="chip"><span>' + esc(p.name) + '</span><button data-act="rmplayer" data-id="' + t.id + '" data-p="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">&times;</button></span>';
      });
      h += !closed && addingP === t.id ? '<input class="chip-in" id="pin-' + t.id + '" data-padd="' + t.id + '" placeholder="Name" aria-label="Player name" autocomplete="off">' : '<button class="chip-add" data-act="addplayer" data-id="' + t.id + '">+ Player</button>';
      h += '</div>';
      h += '</div>';
    });
    h += '<button class="btn block" data-act="add" data-confirm="' + cf + '"' + (S.teams.length >= 16 ? ' disabled' : '') + '>+ Add team</button></div>';
    h += '<div class="group"><span class="label">Mode</span><div class="seg"><button data-act="mode" data-v="1" data-confirm="' + (S.dbl ? cf : '') + '" class="' + (!S.dbl ? 'on' : '') + '">Single round</button><button data-act="mode" data-v="2" data-confirm="' + (S.dbl ? '' : cf) + '" class="' + (S.dbl ? 'on' : '') + '">Home &amp; away</button></div></div>';
    if (S.dirty) h += '<p class="note" style="margin:0 0 8px">Teams or mode changed. The fixtures no longer match.</p>';
    h += '<div class="actions"><button class="btn fill" data-act="regen" data-confirm="' + cf + '">Rebuild fixtures</button>' +
      '<button class="btn warn" data-act="clear" data-confirm="1"' + (cf ? '' : ' disabled') + '>Clear results</button></div>';
    return h;
  }

  /* One scale for every tab: the Teams tab (header + closed team list) must fit the screen height. */
  function fit() {
    var root = document.documentElement, probe = document.getElementById('probe');
    root.style.setProperty('--k', '1');
    probe.innerHTML = renderTeams(true);
    var ids = probe.querySelectorAll('[id]'); for (var i = 0; i < ids.length; i++) ids[i].removeAttribute('id');
    var need = document.querySelector('header.top').offsetHeight + probe.offsetHeight + document.getElementById('foot').offsetHeight + 16;
    probe.innerHTML = '';
    var cs = getComputedStyle(root), bs = getComputedStyle(document.body);
    var avail = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
    var k = Math.max(0.7, Math.min(1, avail / need));
    root.style.setProperty('--k', String(Math.round(k * 100) / 100));
  }

  function render() {
    document.getElementById('app').innerHTML = tab === 'table' ? renderMain() : renderTeams(false);
    ['table', 'teams'].forEach(function (t) { document.getElementById('tab-' + t).className = t === tab ? 'on' : ''; });
    updateHeader();
    fit();
  }

  function updateLive() {
    var s = document.getElementById('standings'), f = document.getElementById('finals');
    if (s) s.innerHTML = renderTable();
    if (f) f.innerHTML = renderFinals();
    var vm = validMatches();
    var rc = document.querySelectorAll('[data-rc]');
    for (var i = 0; i < rc.length; i++) {
      var ms = vm.filter(function (m) { return String(m.round) === rc[i].dataset.rc; });
      rc[i].textContent = ms.filter(isPlayed).length + '/' + ms.length;
    }
    updateHeader();
  }

  function setTab(t) { tab = t; notice = null; render(); window.scrollTo(0, 0); }

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.score) {
      var v = el.value.replace(/\D/g, '').slice(0, 2); el.value = v;
      var m = S.matches.filter(function (x) { return x.id === el.dataset.m; })[0];
      m[el.dataset.score === 'h' ? 'hg' : 'ag'] = v === '' ? null : parseInt(v, 10);
      el.classList.toggle('has', v !== '');
      save(); updateLive();
    } else if (el.dataset.final) {
      var fv = el.value.replace(/\D/g, '').slice(0, 2), kind = el.dataset.final, pr = finalPair(kind); el.value = fv;
      if (!pr) return;
      S.finals = S.finals || {};
      var f = finalEntry(kind) || { h: pr.h.id, a: pr.a.id, hg: null, ag: null };
      f[el.dataset.side === 'h' ? 'hg' : 'ag'] = fv === '' ? null : parseInt(fv, 10);
      S.finals[kind] = f;
      el.classList.toggle('has', fv !== '');
      save();
    } else if (el.dataset.name) {
      S.teams.forEach(function (t) { if (t.id === el.dataset.name) t.name = el.value; });
      save();
    } else if (el.hasAttribute('data-title')) {
      S.title = el.value; save(); updateHeader();
    }
  });

  document.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-tab]');
    if (tb) { setTab(tb.dataset.tab); return; }
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.dataset.act;
    if (b.dataset.confirm && !b.dataset.armed) {
      var prev = document.querySelectorAll('[data-armed]');
      for (var q = 0; q < prev.length; q++) disarm(prev[q]);
      b.dataset.armed = '1'; b.dataset.label = b.textContent;
      b.textContent = b.classList.contains('sq') ? 'Sure?' : 'Sure? Tap again'; b.classList.add('armed');
      if (hasResults()) (b.closest('.field, .seg, .actions') || b).insertAdjacentHTML('afterend', '<p class="hint" id="arm-hint">' + ARM_HINT + '</p>');
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(function () { if (b.isConnected) disarm(b); }, 10000);
      return;
    }
    if (act === 'bk-copy') {
      bk.text = backupText(); bk.mode = 'show'; bk.ok = false; bk.msg = 'Select all and copy the text.';
      render();
      var ta = document.getElementById('bk-text'); if (ta) { ta.focus(); ta.select(); }
      try {
        navigator.clipboard.writeText(bk.text).then(function () { bk.ok = true; bk.msg = 'Copied to clipboard. Keep the text somewhere safe.'; render(); }, function () {});
      } catch (er) {}
      return;
    }
    if (act === 'bk-restore') { bk.mode = 'paste'; bk.msg = ''; render(); var pt = document.getElementById('bk-text'); if (pt) pt.focus(); return; }
    if (act === 'bk-auto') { var at = document.getElementById('bk-text'); if (at) { at.value = autoBackup(); at.focus(); } return; }
    if (act === 'bk-load') {
      var ta2 = document.getElementById('bk-text'), r = parseBackup(ta2 ? ta2.value : '');
      if (r.error) { bk.msg = r.error; bk.ok = false; }
      else {
        if (ta2.value !== autoBackup()) safetyCopy();
        S = r.state; save(); bk.mode = ''; bk.ok = true;
        bk.msg = 'Loaded ' + r.teams + ' teams and ' + r.applied + (r.applied === 1 ? ' result.' : ' results.') + (r.skipped ? ' ' + r.skipped + (r.skipped === 1 ? ' line' : ' lines') + ' could not be matched.' : '');
        tab = 'table';
      }
      render(); return;
    }
    if (act === 'expand') { exp[b.dataset.id] = !exp[b.dataset.id]; updateLive(); return; }
    if (act === 'addplayer') { addingP = b.dataset.id; render(); focusPlayerInput(); return; }
    if (act === 'rmplayer') {
      var tr = findTeam(b.dataset.id); if (!tr) return;
      tr.players = (tr.players || []).filter(function (p) { return p.id !== b.dataset.p; }); save(); render(); return;
    }
    if (act === 'mode' && (b.dataset.v === '2') === S.dbl) return;
    if (act === 'add' || act === 'remove' || act === 'mode' || act === 'regen' || act === 'clear') safetyCopy();
    if (act === 'add') {
      S.teams.push({ id: uid(), name: 'Team ' + (S.teams.length + 1), players: [] }); S.dirty = true; save(); render();
      var last = S.teams[S.teams.length - 1]; var inp = document.getElementById('team-' + last.id); if (inp) { inp.focus(); inp.select(); }
    } else if (act === 'remove') {
      S.teams = S.teams.filter(function (t) { return t.id !== b.dataset.id; }); S.dirty = true; save(); render();
    } else if (act === 'mode') {
      S.dbl = b.dataset.v === '2'; S.dirty = true; save(); render();
    } else if (act === 'regen') {
      S.matches = schedule(S.teams, S.dbl); S.finals = {}; S.dirty = false; save(); render();
    } else if (act === 'clear') {
      S.matches.forEach(function (m) { m.hg = null; m.ag = null; }); S.finals = {}; save(); render();
    }
  });

  function focusPlayerInput() { var pi = document.getElementById('pin-' + addingP); if (pi) pi.focus(); }
  function addPlayer(teamId, name) {
    var tm = findTeam(teamId), v = name.trim();
    if (!tm || !v) return;
    tm.players = tm.players || []; tm.players.push({ id: pid(), name: v }); save();
  }
  /* Enter adds the name and keeps the field open for the next one; leaving the field adds what is typed and closes it. */
  document.addEventListener('keydown', function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.padd) return;
    if (e.key === 'Enter') { e.preventDefault(); el.dataset.done = '1'; addPlayer(el.dataset.padd, el.value); render(); focusPlayerInput(); }
    else if (e.key === 'Escape') { el.dataset.done = '1'; addingP = ''; render(); }
  });
  document.addEventListener('focusout', function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.padd || el.dataset.done) return;
    el.dataset.done = '1'; addPlayer(el.dataset.padd, el.value);
    var id = el.dataset.padd;
    setTimeout(function () { if (addingP === id) { addingP = ''; render(); } }, 0);
  });

  window.addEventListener('resize', function () {
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    fit();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fit(); });

  document.getElementById('ver').textContent = 'Version ' + VERSION + ' \u00b7 ' + BUILD_DATE;
  S = load() || fresh();
  if (!S.matches) S = fresh();
  S.finals = S.finals || {};
  S.teams.forEach(function (t) { t.players = (t.players || []).filter(function (p) { return p.name && p.name.trim(); }); });
  render();
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(VERSION)).catch(function () {}); });
    }
  } catch (e) {}
})();
</script>
